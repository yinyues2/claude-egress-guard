name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning skills/claude-egress-guard/scripts/*

      - name: syntax
        run: |
          for f in skills/claude-egress-guard/scripts/*; do bash -n "$f"; done

      - name: self-test
        run: bash skills/claude-egress-guard/scripts/selftest.sh

      - name: leak scan
        run: python3 tools/leak-scan.py
