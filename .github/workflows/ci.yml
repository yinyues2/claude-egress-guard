name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning install.sh skills/claude-egress-guard/scripts/*

      - name: syntax
        run: |
          bash -n install.sh
          for f in skills/claude-egress-guard/scripts/*; do bash -n "$f"; done

      - name: installer surface
        run: |
          ./install.sh --help >/dev/null
          ./install.sh --proxy http://127.0.0.1:1080 >/dev/null 2>&1 && exit 1 || true
          make --version >/dev/null

      - name: self-test
        run: bash skills/claude-egress-guard/scripts/selftest.sh

      - name: leak scan
        run: python3 tools/leak-scan.py
